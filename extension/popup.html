<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Screen Time</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #09090b; --panel: #111114; --panel2: #17171c; --border: #26262c;
      --text: #f4f4f5; --muted: #9b9ba4; --accent: #3b82f6;
      --good: #34d399; --bad: #f87171; --track: #212127;
    }
    :root[data-theme="light"] {
      --bg: #f7f7f8; --panel: #ffffff; --panel2: #f2f2f5; --border: #e6e6ea;
      --text: #1a1a20; --muted: #71717a; --accent: #2563eb;
      --good: #059669; --bad: #dc2626; --track: #e9e9ee;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 378px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 14px 12px; }
    .head-top { display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
    .brand svg { width: 16px; height: 16px; color: var(--accent); }
    .date { font-size: 11px; color: var(--muted); }

    .hero { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
    .ring { width: 100px; height: 100px; flex: none; }
    .ring-track { fill: none; stroke: var(--track); stroke-width: 8; }
    .ring-fill {
      fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round;
      transform: rotate(-90deg); transform-origin: 60px 60px;
      transition: stroke-dashoffset .5s ease, stroke .3s;
    }
    .ring-time { font-size: 16px; font-weight: 650; fill: var(--text); }
    .ring-sub { font-size: 8px; fill: var(--muted); letter-spacing: .08em; }

    .hero-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 650; }
    .hero-time { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .hero-goal { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .delta { font-size: 11.5px; margin-top: 5px; font-weight: 600; }
    .delta.good { color: var(--good); }
    .delta.bad { color: var(--bad); }

    .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
      font-size: 10.5px; font-weight: 550; padding: 4px 8px;
    }
    .chip i { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }

    .list-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 14px 5px; font-size: 10.5px; font-weight: 650;
      text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    }

    main { max-height: 262px; overflow-y: auto; padding: 2px 10px 8px; }
    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-thumb { background: var(--track); border-radius: 99px; }

    .row { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 6px; }
    .row:hover { background: var(--panel); }
    .row-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

    .favicon { width: 20px; height: 20px; border-radius: 5px; flex: none; }
    .favicon.letter {
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 11px;
    }

    .name-wrap { flex: 1; min-width: 0; }
    .name-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .name { font-size: 12.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-chip {
      flex: none; font-size: 8px; font-weight: 800; letter-spacing: .06em;
      background: var(--accent); color: #fff; padding: 2px 5px; border-radius: 4px;
    }
    .bar-track { height: 4px; background: var(--track); border-radius: 99px; margin-top: 5px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }

    .right { text-align: right; flex: none; }
    .time { font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .pct { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .empty { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; padding: 34px 12px; }

    footer { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
    .dash-btn {
      flex: 1; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
      font-size: 12px; font-weight: 600; padding: 8px; cursor: pointer;
    }
    .dash-btn:hover { filter: brightness(1.08); }
    .web-btn {
      flex: none; width: 42px; background: var(--panel); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .web-btn:hover { border-color: var(--accent); color: var(--accent); }
    .privacy { font-size: 9px; color: var(--muted); width: 66px; line-height: 1.45; text-align: right; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="head-top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Screen Time
      </div>
      <div class="date" id="headDate">&mdash;</div>
    </div>
    <div class="hero">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="52"/>
        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"
                style="stroke-dasharray:326.7; stroke-dashoffset:326.7"/>
        <text class="ring-time" id="ringTime" x="60" y="58" text-anchor="middle">0m</text>
        <text class="ring-sub" id="ringSub" x="60" y="76" text-anchor="middle">OF 4H GOAL</text>
      </svg>
      <div class="hero-right">
        <div class="hero-label">Today</div>
        <div class="hero-time" id="heroTime">0m</div>
        <div class="hero-goal" id="heroGoal">0% of daily goal</div>
        <div class="delta" id="heroDelta"></div>
      </div>
    </div>
    <div class="cats" id="catRow"></div>
  </header>

  <div class="list-head"><span>Top sites &middot; Today</span><span id="listCount">0 sites</span></div>
  <main id="list">
    <div class="empty">No data yet &mdash; open a few websites and tracking starts automatically.</div>
  </main>

  <footer>
    <button id="dashBtn" class="dash-btn" type="button">Open dashboard</button>
    <button id="webBtn" class="web-btn" type="button" title="Open web dashboard" style="display:none">Web</button>
    <span class="privacy">Local only. Data never leaves this browser.</span>
  </footer>

  <script src="categories.js"></script>
  <script src="popup.js"></script>
</body>
</html>
